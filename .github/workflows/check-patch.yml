name: Check LoL patch

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 min (~1440 min/mois, sous le quota gratuit privé)
  workflow_dispatch:          # bouton "Run workflow" manuel
    inputs:
      force:
        description: "Forcer l'envoi même sans nouveau patch"
        type: boolean
        default: false

concurrency:
  group: check-patch
  cancel-in-progress: false

permissions:
  contents: write   # pour committer data/state.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier les patchs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python src/main.py --force
          else
            python src/main.py
          fi

      - name: Persister l'état si changé
        run: |
          if ! git diff --quiet data/state.json; then
            git config user.name "lol-patch-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/state.json
            git commit -m "chore: maj version patch [skip ci]"
            git push
          fi
