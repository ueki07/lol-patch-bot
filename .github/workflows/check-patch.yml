name: Check LoL patch

on:
  schedule:
    # Fenêtre patch (mar/mer/jeu UTC) : détection à 15 min près le jour J.
    - cron: "*/15 * * * 2,3,4"
    # Reste de la semaine : filet de sécurité léger pour les hotfixes.
    - cron: "0 */8 * * 0,1,5,6"
    # ~1300 min/mois au total, sous le quota gratuit (2000 min) d'un repo privé.
  workflow_dispatch:          # bouton "Run workflow" manuel
    inputs:
      force:
        description: "Forcer l'envoi même sans nouveau patch"
        type: boolean
        default: false

concurrency:
  group: check-patch
  cancel-in-progress: false

permissions:
  contents: write   # pour committer data/state.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier les patchs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python src/main.py --force
          else
            python src/main.py
          fi

      - name: Persister l'état si changé
        run: |
          if ! git diff --quiet data/state.json; then
            git config user.name "lol-patch-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/state.json
            git commit -m "chore: maj version patch [skip ci]"
            git push
          fi
